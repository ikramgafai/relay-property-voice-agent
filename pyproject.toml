[project]
name = "relay-property-voice-agent"
version = "0.10.0"
description = "Real-time voice agent infrastructure with property-scoped routing, durable workflows and transactional tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=25,<26",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "tzdata>=2025.1",
    "httpx>=0.28,<1",
    "websockets>=17.2",
    "livekit>=1,<2",
    "livekit-api>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "evaluations"]

[project.scripts]
relay = "app.core.server:main"
relay-seed = "app.db.seed:main"
relay-eval-routing = "evaluations.run_routing:main"
relay-eval-stt-live = "evaluations.run_stt_live:main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: requires the isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app", "backend/tests", "backend/migrations", "evaluations"]
plugins = ["pydantic.mypy"]

[tool.uv]
required-version = ">=0.12.24"
