# Separate project and ephemeral PostgreSQL storage: never touches the development volume.
name: relay-phase2-tests
services:
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: ["--dev", "--bind", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7880 >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 20
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_test_only
      POSTGRES_DB: relay_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  tests:
    build:
      context: .
      target: test
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://relay:relay_test_only@postgres:5432/relay_test
      TEST_LIVEKIT_URL: ws://livekit:7880
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_healthy
