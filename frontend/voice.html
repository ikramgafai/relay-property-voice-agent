<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay · Voice demo</title>
<style>
body{font:17px system-ui;max-width:800px;margin:48px auto;padding:0 24px;background:#f6f7f8;color:#182b32}
label{display:block;margin:16px 0}input,button{font:inherit;padding:10px}input{width:95%}
button{cursor:pointer;margin:8px 8px 8px 0}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:8px}
#audiolog{font-size:14px;color:#46606a}
</style>
<h1>Relay · Voice</h1>
<p>Internal demo. Your microphone is sent to LiveKit and AssemblyAI. Relay replies in text; when speech output is enabled on the server, it also speaks. The text is authoritative. Use headphones to avoid feeding Relay's voice back into the microphone.</p>
<label>Relay backend <input id="base" value="http://127.0.0.1:8000"></label>
<label>Existing conversation session UUID <input id="session" autocomplete="off"></label>
<button id="start">Connect microphone</button><button id="stop" disabled>Disconnect</button>
<button id="enableAudio" hidden>Enable Relay audio</button>
<p id="status" role="status">Disconnected</p><p id="partial"></p>
<p id="voice" role="status"></p>
<pre id="output" aria-live="polite"></pre>
<audio id="agent" autoplay></audio>
<pre id="audiolog" aria-label="Voice timing diagnostics"></pre>
<script type="module">
import {Room, RoomEvent} from 'https://cdn.jsdelivr.net/npm/livekit-client@2.22.4/+esm';
import {AgentAudio, describeAudioEvent} from './relay-audio.mjs';
const byId = id => document.getElementById(id);
let socket, room, agent, sequence = 0, currentSession, origin = 0;
function event(kind) {
  socket.send(JSON.stringify({session_id:currentSession,sequence:++sequence,event_type:kind,payload:{kind}}));
}
// Local monotonic diagnostics only; these are never compared with server clocks.
function timeline(entry) {
  const ms = Math.round(entry.at - origin);
  const output = entry.speech_output_id ? ' output='+entry.speech_output_id : '';
  byId('audiolog').textContent += `+${ms} ms ${entry.kind}${output}\n`;
}
function playbackState() {
  byId('enableAudio').hidden = !room || room.canPlaybackAudio;
}
async function stop() {
  const oldRoom = room; room = undefined;
  if(oldRoom) await oldRoom.disconnect();
  if(agent) {agent.close(); agent = undefined;}
  const oldSocket = socket; socket = undefined;
  if(oldSocket) oldSocket.close();
  byId('enableAudio').hidden=true;
  byId('start').disabled=false;byId('stop').disabled=true;byId('status').textContent='Disconnected';
}
byId('stop').onclick=stop;
byId('enableAudio').onclick=async () => {if(room) {await room.startAudio(); playbackState();}};
byId('agent').addEventListener('playing',()=>{if(agent) agent.onPlaying();});
byId('start').onclick=async () => {
  byId('start').disabled=true;byId('stop').disabled=false;
  const base=byId('base').value.replace(/\/$/,'');currentSession=byId('session').value.trim();
  sequence=0;origin=performance.now();byId('audiolog').textContent='';byId('voice').textContent='';
  agent=new AgentAudio({sessionId:currentSession, element:byId('agent'), log:timeline});
  try {
    socket=new WebSocket(base.replace(/^http/,'ws')+'/api/realtime/'+encodeURIComponent(currentSession));
    await new Promise((resolve,reject)=>{socket.onopen=resolve;socket.onerror=reject;});
    const started=new Promise((resolve,reject)=>{
      socket.onmessage=message=>{
        const e=JSON.parse(message.data), p=e.payload;
        if(e.event_type==='SESSION_STARTED') resolve();
        if(e.event_type==='ERROR') {byId('status').textContent=p.code;reject(new Error(p.code));}
        if(e.event_type==='STT_PARTIAL') byId('partial').textContent=p.transcript;
        if(e.event_type==='STT_FINAL') {byId('partial').textContent='';byId('output').textContent+='You: '+p.transcript+'\n';}
        if(e.event_type==='AGENT_RESPONSE') byId('output').textContent+='Relay: '+p.response_text+'\n\n';
        if(e.event_type==='STT_FAILED') {void stop().then(()=>byId('status').textContent=p.message);}
        const audio = agent ? agent.handleServerEvent(e) : null;
        if(audio) byId('voice').textContent=describeAudioEvent(audio);
      };
      socket.onclose=()=>{reject(new Error('Control connection closed'));void stop();};
    });
    event('SESSION_START');await started;
    const response=await fetch(base+'/api/voice/'+encodeURIComponent(currentSession)+'/token',{
      method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if(!response.ok) throw new Error('Voice admission failed: '+response.status);
    const admission=await response.json();
    room=new Room();room.on(RoomEvent.Disconnected,()=>void stop());
    // Only Relay's agent track for this session is attached; anything else is ignored.
    room.on(RoomEvent.TrackSubscribed,(track,publication,participant)=>{if(agent) agent.onTrackSubscribed(track,publication,participant);});
    room.on(RoomEvent.TrackUnsubscribed,track=>{if(agent) agent.onTrackUnsubscribed(track);});
    room.on(RoomEvent.ActiveSpeakersChanged,speakers=>{if(agent) agent.onActiveSpeakers(speakers);});
    room.on(RoomEvent.AudioPlaybackStatusChanged,playbackState);
    await room.connect(admission.livekit_url,admission.participant_token);
    await room.localParticipant.setMicrophoneEnabled(true);
    playbackState();
    byId('status').textContent='Microphone connected — responses appear below';
  } catch(error) {await stop();byId('status').textContent=error.message || 'Connection failed';}
};
window.addEventListener('pagehide',()=>{if(room) void room.disconnect();if(agent) agent.close();if(socket) socket.close();});
</script>
</html>
